server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA fallback: /employees/5 isn't a file, so serve index.html and let vue-router handle it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets never change -> cache forever. index.html must not be cached, or users get stale bundles.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
